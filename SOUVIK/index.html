<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souvik Paul — Video Editor & Motion Graphic Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #0c0c10;
    --surface: #16161c;
    --surface-hi: #1e1e26;
    --line: #2a2a33;
    --text: #f5f3ee;
    --muted: #8a8a94;
    --accent: #ff4d2e;      /* render-bar orange-red */
    --accent-2: #2ee6a6;    /* waveform mint */
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100svh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }

  /* faint moving waveform behind everything */
  .waveform{
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.16;
    pointer-events: none;
  }
  .waveform svg{
    width: 220%;
    height: 100%;
    animation: drift 26s linear infinite;
  }
  @keyframes drift{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  .page{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 430px;
    padding: 28px 22px 40px;
    display:flex;
    flex-direction: column;
    min-height: 100svh;
  }

  /* running timecode ticker */
  .timecode-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    margin-bottom: 40px;
  }
  .timecode-bar .rec{
    display:flex;
    align-items:center;
    gap:6px;
    color: var(--accent);
  }
  .rec .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.25; }
  }

  /* hero */
  .hero{
    margin-bottom: 34px;
  }
  .avatar-ring{
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 26px;
    color: var(--text);
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .avatar-ring img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .avatar-ring::after{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border: 1px solid var(--accent);
    clip-path: inset(0 0 65% 0);
    animation: spin 3.5s linear infinite;
  }
  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 9vw, 40px);
    line-height: 1.05;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
    overflow: hidden;
  }
  h1 span{
    display:inline-block;
    transform: translateY(110%);
    animation: rise 0.7s cubic-bezier(.16,1,.3,1) forwards;
  }
  h1 span:nth-child(2){ animation-delay: 0.06s; }
  @keyframes rise{
    to{ transform: translateY(0); }
  }

  .role{
    font-size: 15px;
    color: var(--muted);
    line-height: 1.5;
    max-width: 30ch;
  }
  .role strong{
    color: var(--text);
    font-weight: 500;
  }

  /* software row */
  .stack{
    display:flex;
    gap:10px;
    margin: 22px 0 36px;
  }
  .badge{
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border: 1px solid var(--line);
  }
  .badge.ps{ background:#001e36; color:#31a8ff; }
  .badge.pr{ background:#00082e; color:#9999ff; }
  .badge.ae{ background:#1a0a33; color:#b28dff; }

  /* links */
  .links{
    display:flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 40px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    padding: 15px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    text-decoration:none;
    color: var(--text);
    transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  .link-card:active{ transform: scale(0.98); }
  .link-card:hover{
    border-color: var(--accent);
    background: var(--surface-hi);
  }

  .link-icon{
    width: 38px;
    height: 38px;
    flex-shrink:0;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--surface-hi);
  }
  .link-icon svg{ width:19px; height:19px; }

  .link-text{ flex:1; min-width:0; }
  .link-title{
    font-weight: 600;
    font-size: 14.5px;
  }
  .link-sub{
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .link-card .arrow{
    color: var(--muted);
    font-size: 16px;
    flex-shrink:0;
  }

  .instagram .link-icon svg{ stroke: #ff4d8d; }
  .behance .link-icon svg{ fill: #1769ff; }
  .whatsapp .link-icon svg{ fill: #25d366; }

  footer{
    margin-top: auto;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding-top: 20px;
  }
  footer .avail{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom: 8px;
    color: var(--accent-2);
    font-weight: 500;
  }
  footer .avail .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent-2);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
    h1 span{ transform: none; }
  }
</style>
</head>
